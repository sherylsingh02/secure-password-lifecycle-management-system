{% extends "base.html" %}

{% block title %}Sign In - CryptaShield{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="glass-card">
        <h2 style="text-align: center; margin-bottom: 24px;">System Authentication</h2>
        
        <form action="{{ url_for('auth.login') }}" method="POST" autocomplete="off">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            
            <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                <span style="font-size: 0.8rem; color: var(--text-secondary);">
                    🔒 Constant-time Argon2 verification
                </span>
                <span style="font-size: 0.8rem; color: var(--text-secondary);">
                    🛡️ Auto-lockout active
                </span>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Authenticate</button>
        </form>
        
        <p style="text-align: center; margin-top: 24px; font-size: 0.875rem; margin-bottom: 0;">
            Need an account? <a href="{{ url_for('auth.register') }}" style="color: var(--color-primary); text-decoration: none; font-weight: 500;">Register here</a>.
        </p>
    </div>
</div>
{% endblock %}
